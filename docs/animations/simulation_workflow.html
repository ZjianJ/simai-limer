function text(x,y,label,color='#ebf4ff',size=15){return `<text x="${x}" y="${y}" text-anchor="middle" fill="${color}" font-size="${size}">${label}</text>`;}
function network(time){const stage=stageAt(time),ms=clockAt(time),faults=new Map(DATA.seeds[seed].schedule.map(f=>[f.target_link_id,f]));let out='';
 out+='<rect x="10" y="10" width="980" height="120" rx="15" fill="#11352f"/>'+text(500,35,tr('PLANE A · internal fabric collapsed','平面 A · 内部 fabric 已折叠'),'#54dfc5');
 out+='<rect x="10" y="405" width="980" height="120" rx="15" fill="#172d50"/>'+text(500,510,tr('PLANE B · internal fabric collapsed','平面 B · 内部 fabric 已折叠'),'#91b0ff');
 for(let r=0;r<2;r++)for(let slot=0;slot<4;slot++){const x=125+245*slot,y=r?447:80;out+=`<rect x="${x-63}" y="${y-20}" width="126" height="40" rx="8" fill="#233d51" stroke="${r?'#91b0ff':'#54dfc5'}"/>`+text(x,y+5,`ToR ${20+slot+r*4}`);}
 for(let server=0;server<4;server++){out+=`<rect x="${30+server*245}" y="160" width="220" height="205" rx="12" fill="#0c1a2d" stroke="#47617b"/>`+text(140+server*245,184,tr('Server','服务器')+' '+server)+text(140+server*245,349,tr('4 GPUs + local NVSwitch','4 GPU + 本地 NVSwitch'),'#a8bfd8',12);}
 for(const link of DATA.access_links){const gpu=+link.src_node,r=+link.src_port-2,[x,y]=gpuXY(gpu),tx=125+245*(gpu%4),ty=r?427:100,f=faults.get(link.link_id),selected=stage>=2&&!!f,active=selected&&ms>=1;
 const color=selected?'#ffc078':r?'#91b0ff':'#54dfc5',opacity=selected?(active?.8+.2*Math.sin(time*4):.8):.22;
 out+=`<path data-link="${link.link_id}" data-fault="${selected}" d="M${x} ${y+(r?16:-16)}L${tx} ${ty}" stroke="${color}" stroke-width="${selected?3:1.2}" opacity="${opacity}" ${selected&&!active?'stroke-dasharray="5 4"':''} fill="none"><title>${link.link_id}${f?' | slowdown '+(f.severity*100).toFixed(2)+'%':''}</title></path>`;}
 for(let id=0;id<16;id++){const [x,y]=gpuXY(id);out+=`<rect x="${x-32}" y="${y-17}" width="64" height="34" rx="7" fill="#29445d" stroke="#aec5dd"/>`+text(x,y+5,`GPU ${id}`,undefined,12);}
 $('topology').innerHTML=out;
 $('phasebadge').textContent=stage<2?tr('32 ACCESS links','32 条 ACCESS 链路'):ms<1?tr('8 selected · not yet active','已选 8 条 · 尚未生效'):tr('8 degraded · carrier UP','8 条减速 · carrier UP');
}
function configurations(){const c=DATA.config;const rows=[
 [tr('Simulator','仿真平台'),'SimAI + ns-3'],[tr('GPUs / servers','GPU / 服务器'),'16 / 4'],[tr('ACCESS bandwidth','ACCESS 标称带宽'),'100 Gb/s'],[tr('Message / GPU','每 GPU 输入'),'64 MiB'],[tr('Collective','通信任务'),'1 × AllReduce'],[tr('B8 update trigger','B8 更新触发'),tr('Every completion','每次完成反馈')],[tr('Chunk size','chunk 大小'),c.chunk_bytes/1024+' KiB'],[tr('Active chunks / source','每源活动 chunk 上限'),c.max_active],
 [tr('Random links (a)','随机链路数 a'),c.a+' / 32'],[tr('Slowdown ceiling','减速上限'),c.b_max_percent+'%'],[tr('Fault starts','故障开始'),c.start_ns/1e6+' ms'],[tr('Observation window','观察窗口'),c.horizon_ns/1e6+' ms'],[tr('Telemetry interval','遥测间隔'),c.sample_us/1000+' ms'],[tr('Simulator CPU workers','仿真 CPU 线程'),'1']];
 $('config').innerHTML=rows.map(([k,v])=>`<div class="kv"><small>${k}</small><strong>${v}</strong></div>`).join('');
 $('faultRows').innerHTML=DATA.seeds[seed].schedule.map(f=>{const l=DATA.access_links.find(l=>l.link_id===f.target_link_id);return `<tr><td>${f.target_link_id}</td><td>${l.src_port==='2'?'A':'B'}</td><td>${(f.severity*100).toFixed(2)}%</td><td>${(f.parameter_after*100).toFixed(2)}%</td></tr>`}).join('');
 $('hash').textContent='SHA256: '+DATA.seeds[seed].fault_sha256.slice(0,20)+'…';
}
function results(){const policies=['B0','B1','B2','B3','B4','B6','B7','B8'];const names={B0:tr('Single rail B','主 rail B 单路'),B1:tr('Fixed 50:50','固定 50:50'),B2:tr('Static calibrated weights','健康校准固定比例'),B3:tr('State-capacity oracle','状态容量 Oracle'),B4:tr('Capacity + queues','容量 + 队列 Oracle'),B6:tr('EWMA + queues','吞吐 EWMA + 队列'),B7:tr('First-probe weights','首对反馈固定比例'),B8:tr('Continuous chunk feedback','持续 chunk 反馈')};
 const head=`<tr><th>${tr('Policy','策略')}</th><th>42</th><th>43</th><th>44</th><th>${tr('Mean / ms','平均 / ms')}</th></tr>`;$('resultHead').innerHTML=head;$('allHead').innerHTML=head;
 function row(p){const values=['42','43','44'].map(s=>DATA.seeds[s].results[p].workload_finish_ns/1e6);return `<tr ${p==='B8'?'class="good"':''}><td>${p} · ${names[p]}</td>${values.map(v=>`<td>${v.toFixed(3)}</td>`).join('')}<td>${(values.reduce((a,b)=>a+b)/3).toFixed(3)}</td></tr>`;}
 $('resultRows').innerHTML=['B0','B1','B8'].map(row).join('');$('allRows').innerHTML=policies.map(row).join('');
 $('audit').innerHTML=[['16 / 16',tr('Ranks at the finish barrier','rank 到达完成屏障')],['480 MiB',tr('ACKed cross-server payload per run','每次正式运行跨服务器 ACK 有效载荷')],['24 + 8',tr('Policy comparisons + rail calibrations','正式策略对照 + 单 rail 校准')]].map(([a,b])=>`<div class="panel"><strong>${a}</strong>${b}</div>`).join('');
}
function render(){const s=stageAt(t),ms=clockAt(t);network(t);
 document.querySelectorAll('[data-stage]').forEach((n,i)=>n.classList.toggle('active',i===s));
 $('chapterTitle').textContent=tr(...stages[s]);$('chapterText').textContent=tr(...notes[s]);
 $('simClock').textContent=t<26?tr('Not started','尚未开始'):`${ms.toFixed(3)} ms`;
 $('runs').innerHTML=['B0','B1','B8'].map((p,i)=>{const finish=DATA.seeds[seed].results[p].workload_finish_ns/1e6,shown=t>=26,complete=shown&&ms>=finish;
 return `<div class="runrow"><strong>${p}</strong><div class="track"><div class="fill" style="width:${shown?Math.min(ms,finish)/9*100:0}%;background:${i===2?'#54dfc5':i===1?'#91b0ff':'#ffbf69'}"></div></div><span>${complete?tr('Finished','已完成')+' '+finish.toFixed(3)+' ms':shown?tr('Running…','运行中…'):tr('Waiting','等待运行')}</span></div>`;}).join('');
 $('resultsPanel').hidden=s<4;$('audit').hidden=s<5;
 $('time').textContent=`${t.toFixed(1)} / ${DURATION} ${tr('demo s','演示秒')}`;$('seek').value=t/DURATION*1000;
 $('play').textContent=playing?tr('Ⅱ Pause','Ⅱ 暂停'):t>=DURATION?tr('↺ Replay','↺ 再播放'):tr('▶ Play','▶ 播放');
}
function language(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=tr('LIMER · Simulation Workflow','LIMER · 仿真实验流程');$('language').textContent=tr('中文','English');
 const labels={title:['From configuration to auditable results','从仿真配置到可审计结果'],subtitle:['Experiment walkthrough · Recorded configuration and finish times; illustrative choreography','实验流程动画 · 配置与完成时间来自记录，画面编排为示意'],topologyTitle:['16 GPUs · Two independent rails','16 GPU · 双独立 rail'],topologyNote:['A/B: healthy links. Dashed amber: scheduled faults. Solid amber: active slowdown. Each ToR connects the same GPU slot across servers; local NVSwitch edges and fabric interiors are omitted.','A/B：正常链路。黄色虚线：已选待生效；黄色实线：已减速。每个 ToR 连接各服务器中相同槽位的 GPU；省略了本地 NVSwitch 连线及 fabric 内部链路。'],runTitle:['Independent runs · synchronized display only','各自独立运行 · 这里只同步展示'],runNote:['0–9 ms zoom: bars show elapsed simulation time, not transferred bytes. Observation continues to 100 ms. Packet motion is not replayed.','0～9 ms 放大视图：条形表示已历仿真时间，不是字节完成百分比。观察窗口持续到 100 ms；本动画不回放数据包。'],configTitle:['Frozen experiment configuration','固定实验配置'],faultTitle:['Recorded random fault schedule','记录中的随机故障时间表'],seedLabel:['Seed','种子'],faultNote:['Select a recorded seed—not a new simulation. Each link keeps service fraction 1 − b. B8 reads completion feedback, not this schedule.','选择已有种子，不会启动新仿真。每条链路保留 1−b 的服务比例。B8 读取完成反馈，不读取此时间表。'],restart:['↺ Restart','↺ 重播'],fullscreen:['Fullscreen','全屏'],resultsTitle:['Recorded AllReduce completion times · ms','记录中的 AllReduce 完成时间 · ms'],resultNote:['Columns 42/43/44 are paired fault seeds, not repeated trials of the same schedule. Time zero → all-16-rank finish barrier; not recovery latency.','42/43/44 是不同故障时间表的配对种子，不是同一故障的重复运行。时间从零计到全部 16 rank 完成屏障，不是恢复延迟。'],allLabel:['Show all eight measured policies','查看全部八种实测策略']};
 for(const [id,pair]of Object.entries(labels))$(id).textContent=tr(...pair);
 $('steps').innerHTML=stages.map((v,i)=>`<button data-stage="${i}">${i+1}. ${tr(...v)}</button>`).join('');document.querySelectorAll('[data-stage]').forEach((n,i)=>n.onclick=()=>{t=CUES[i];render();});
 $('faultHead').innerHTML=`<tr>${[tr('Link','链路'),'Rail',tr('Slowdown','减速'),tr('Remaining','保留')].map(v=>`<th>${v}</th>`).join('')}</tr>`;
 $('footer').innerHTML=tr('Source: experiment random_a8_b80_t1ms_20260908. This page is a presentation, not a browser simulator. Three seeds do not establish statistical significance or tail guarantees. No tensor validation or hard-failure recovery is claimed.','来源：实验 random_a8_b80_t1ms_20260908。本页是讲解动画，不是在浏览器重新仿真。三个种子不支持统计显著性或尾部可靠性保证；未声称验证 tensor 数值或硬故障恢复。')+` <a href="simulation_evidence.json">${tr('Evidence extract','证据摘录')}</a> · <a href="simulation_workflow.md">${tr('Scope & provenance','范围与来源')}</a> · <a href="chunk_feedback.html">${tr('B8 algorithm animation','B8 算法动画')}</a>`;
 const aria={steps:['Workflow stages','实验流程阶段'],topology:['Four servers, 16 GPUs and 32 ACCESS links to A/B ToRs','四台服务器、16个GPU及接入A/B ToR的32条ACCESS链路'],seek:['Presentation progress','演示进度'],speed:['Playback speed','播放速度'],language:['Switch to Chinese','切换英文']};for(const[id,pair]of Object.entries(aria))$(id).setAttribute('aria-label',tr(...pair));
 configurations();results();render();
}
function toggle(){if(t>=DURATION)t=0;playing=!playing;render();}
$('language').onclick=()=>{lang=lang==='en'?'zh':'en';language();};$('seed').onchange=e=>{seed=e.target.value;configurations();render();};$('play').onclick=toggle;$('restart').onclick=()=>{t=0;playing=true;render();};$('seek').oninput=e=>{t=+e.target.value/1000*DURATION;render();};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('fullscreen').textContent=tr('Use browser fullscreen','请使用浏览器全屏');}};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle();}if(['ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();t=Math.min(DURATION,Math.max(0,t+(e.code==='ArrowRight'?2:-2)));render();}});
function frame(now){if(last!==null&&playing){t=Math.min(DURATION,t+(now-last)/1000*+$('speed').value);if(t>=DURATION)playing=false;render();}last=now;requestAnimationFrame(frame);}language();requestAnimationFrame(frame);
globalThis.workflowDemo={DATA,stageAt,clockAt,render,language,state:()=>({lang,t,seed,playing})};
