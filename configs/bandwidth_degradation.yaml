# Parameters used by limer/scripts/run_fault_monitoring.sh (Fault A).
topology_base: Spectrum-X_8g_4gps_100Gbps_A100
topology_fault: topology_bandwidth_degradation  # generated by tools/make_fault_topology.py
workload: microAllReduce_10iter.txt
configuration: SimAI.baseline.conf
telemetry_interval_us: 1000
fault:
  fault_id: bandwidth_degradation
  target_link: {src: 3, dst: 13}  # GPU rank 3's ACCESS link to its ASW (link_id L3-13)
  parameter_before: 100Gbps
  parameter_after: 50Gbps
  mechanism: >
    Single field edit in a copy of the topology file (data_rate column of
    the "3 13 <bw> <delay> <error_rate>" link line) - no simulator code
    change. See astra-sim-alibabacloud/astra-sim/network_frontend/ns3/common.h
    SetupNetwork() for where this field is read.
  scope: static, whole simulation run (no dynamic/time-windowed fault injection in M1)
observed_effect: >
  AllReduce completion time nearly doubles: 25.25ms (healthy) -> 49.93ms
  (fault) - see results/fault/fault-bandwidth_degradation/run.log and
  results/charts/healthy_vs_faulty_comparison.png.
