# Parameters used by limer/scripts/run_fault_monitoring.sh (Fault B).
topology_base: Spectrum-X_8g_4gps_100Gbps_A100
topology_fault: topology_packet_loss  # generated by tools/make_fault_topology.py
workload: microAllReduce_10iter.txt
configuration: SimAI.baseline.conf
telemetry_interval_us: 1000
fault:
  fault_id: packet_loss
  target_link: {src: 3, dst: 13}  # same ACCESS link as bandwidth_degradation
  parameter_before: error_rate=0.0
  parameter_after: error_rate=0.005
  mechanism: >
    Single field edit in a copy of the topology file (error_rate column) ->
    ns3::RateErrorModel with ERROR_UNIT_PACKET on that link's QbbNetDevice.
    Same mechanism as bandwidth_degradation, different field - no
    simulator code change for either fault.
status: BLOCKED
observed_symptom: >
  Simulation does not complete within the 280s wall-clock timeout
  (exit code 124); run.log shows progress stalling early, partway through
  layer_01's AllReduce (layer_00 completes). Reproduced consistently.
best_available_diagnosis: >
  Consistent with the RDMA go-back-N retransmission path in
  ns-3-alibabacloud's RdmaHw::ReceiverCheckSeq (see
  docs/code_map.md section B) entering a slow repeated NACK/retry cycle
  under sustained per-packet loss faster than the simulation can make
  forward progress in real time, rather than a true infinite loop -
  root-causing this precisely (single-stepping the NACK/retransmit state
  machine under loss) is out of scope for M1. See limer/README.md "known
  limitations" and "next steps".
