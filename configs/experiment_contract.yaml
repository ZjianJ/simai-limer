schema_version: 1
contract_id: limer-true16-dual-plane-v1
status: normative
description: >-
  Machine-readable experiment and stage-gate contract for the LIMER true-16
  dual-plane SimAI gray-fault detection and selective-recovery project.

units:
  simulation_timestamp: ns
  latency: ns
  bandwidth: bps
  queue: bytes
  rate_reporting: Gbps
  false_alarm_rate: alarms_per_port_hour

reproducibility:
  required_manifest_fields:
    - contract_id
    - contract_sha256
    - simai_revision
    - ns3_revision
    - dirty_worktree
    - topology_path
    - topology_sha256
    - workload_path
    - workload_sha256
    - simulator_config_path
    - simulator_config_sha256
    - detector_id
    - detector_artifact_sha256
    - split_manifest_sha256
    - schedule_sha256
    - run_id
    - run_role
    - virtual_start_ns
    - virtual_finish_ns
    - wall_start_utc
    - wall_finish_utc
    - exit_code
  change_policy: >-
    A required-field, threshold, denominator, split, topology-role, or evidence
    semantic change requires a new contract version and migration note.
  manual_improvement_numbers_forbidden: true

topology:
  generator:
    topology: Spectrum-X
    dual_tor: true
    dual_plane: true
    gpu_count: 16
    gpus_per_server: 4
    gpu_type: A100
    fabric_bandwidth: 100Gbps
    intra_node_bandwidth: 2400Gbps
    asw_count: 8
    psw_count: 64
    asw_psw_bandwidth: 400Gbps
  invariants:
    gpu_count: 16
    server_count: 4
    gpus_per_server: 4
    nvswitch_count: 4
    asw_count: 8
    psw_count: 64
    regular_switch_count: 72
    total_node_count: 92
    physical_link_count: 304
    link_class_counts:
      INTRA_NODE: 16
      ACCESS: 32
      INTER_SWITCH: 256
    access_links_per_plane: 16
    isolated_switch_plane_count: 2
    switch_nvswitch_port_endpoints: 560
    switch_directional_rows_per_snapshot: 1120
    host_device_rows_per_snapshot: 48
  plane_a:
    plane_id: 0
    role: standby
    host_port: 2
    route_bucket: 0
    asw_node_ids: [20, 21, 22, 23]
    psw_node_id_range: [28, 59]
  plane_b:
    plane_id: 1
    role: active
    host_port: 3
    route_bucket: 1
    asw_node_ids: [24, 25, 26, 27]
    psw_node_id_range: [60, 91]
  intra_server:
    role: nvswitch
    host_port: 1
  initial_scored_fault_scope:
    link_class: ACCESS
    plane: B
    target_count: 16
    one_faulted_access_link_per_primary_run: true
    whole_plane_failure_is_separate_stress_test: true
  runtime_identity_authority: link_map.csv

telemetry:
  clock: ns3_virtual_time
  coherent_snapshot_interval_ns: 1000000
  snapshot_intervals_below_floor_are_invalid: true
  expected_switch_directional_rows_per_snapshot: 1120
  expected_host_device_rows_per_snapshot: 48
  snapshot_key:
    switch: [run_id, timestamp_ns, switch_id, port_id, direction]
    host: [run_id, timestamp_ns, node_id, nic_id]
  required_properties:
    - full_expected_endpoint_coverage
    - no_duplicate_snapshot_keys
    - monotonic_timestamps
    - monotonic_cumulative_counters_or_documented_reset
    - causal_counter_conservation_with_inflight_tolerance
    - event_updated_queue_high_water
    - event_driven_link_transitions
  precision_boundary: >-
    Coherent 1 ms snapshots are not a continuous-time event trace. Hard faults
    use event delivery; cumulative counters, link transitions, and interval
    queue high-water evidence may retain sub-ms events.

workload:
  world_size: 16
  communicator_count: 1
  communicator_world_size: 16
  collective: ALLREDUCE
  require_all_rank_participation: true
  causal_feature_warmup_ns: 100000000
  healthy_monitoring_minimum_virtual_span_ns: 100000000
  healthy_monitoring_minimum_snapshot_count_at_1ms: 101
  recovery_observation_after_fault_ns: 1000000000

fault_taxonomy:
  hard:
    top_level_label: HARD_FAULT
    requires_layer0_event_path: true
    families:
      hard_disconnect:
        link_state_during_fault: down
        primary_recovery_case_is_permanent: true
      carrier_flap:
        link_state_during_fault: down
        minimum_transition_pattern: [down, up]
  gray:
    top_level_label: GRAY_FAULT
    link_state_during_scored_interval: up
    families:
      bandwidth_degradation:
        remaining_nominal_capacity_fractions: [0.8, 0.5, 0.2]
        shapes: [step, ramp]
        ramp_durations_ns: [10000000, 50000000, 100000000]
      random_loss:
        packet_error_probabilities: [0.0001, 0.001, 0.005, 0.01, 0.05]
        simulator_stability_gate_required: true
      burst_loss:
        shapes: [periodic, random]
        finite: true
      service_degradation:
        required_effects: [queue_growth, latency_growth, throughput_degradation]
      intermittent_service:
        allowed_impairments: [capacity, loss, service]
        carrier_must_remain_up: true
  negative:
    healthy:
      top_level_label: HEALTHY
      injected_physical_fault: false
    congestion:
      top_level_label: CONGESTION
      injected_physical_fault: false
      required_scenarios:
        - high_utilization
        - allreduce_burst
        - incast
        - ecmp_or_hash_contention
        - queue_buildup
        - ecn
        - pfc
      label_source: predeclared_workload_or_network_schedule
      feature_derived_labels_forbidden: true
  decision_only_states: [UNKNOWN, INSUFFICIENT_EVIDENCE]
  scheduled_unobservable_policy:
    retain_in_scheduled_metrics: true
    mark_observable_false: true
    report_scheduled_and_observable_recall: true

timepoints:
  clock: ns3_virtual_time
  fields:
    fault_scheduled_onset_ns: schedule_requested_onset
    fault_applied_ns: actual_data_path_impairment_onset_and_primary_t_fault
    first_observable_effect_ns: first_causal_target_or_peer_signal_effect
    layer0_observe_ns: hard_event_observed
    layer1_suspect_ns: lightweight_gate_enters_suspect
    controller_ingest_ns: required_context_available_at_controller
    controller_decision_ns: confirmed_classification_complete
    alarm_emit_ns: alarm_enqueued_on_alarm_bus
    alarm_deliver_ns: alarm_reaches_recovery_consumer
    alarm_actionable_ns: consumer_can_act_with_link_plane_class_and_action
    quarantine_applied_ns: link_administratively_removed_from_new_routes
    primary_quiesced_ns: affected_qps_stop_new_primary_traffic
    route_update_complete_ns: updated_route_state_is_usable
    backup_activated_ns: preestablished_backup_binding_is_active
    first_backup_tx_ns: first_affected_qp_data_on_backup
    first_backup_ack_ns: first_useful_affected_qp_ack_on_backup
    collective_abort_ns: old_attempt_becomes_non_committable
    collective_redo_start_ns: new_attempt_epoch_starts
    training_progress_resume_ns: current_epoch_collective_progress_with_surviving_path_evidence
    collective_commit_ns: exactly_one_valid_attempt_is_published
  primary_fault_time: fault_applied_ns
  primary_alarm_time: alarm_actionable_ns
  progress_resume_requires:
    - first_backup_ack_ns
    - post_action_current_epoch_collective_progress
  invalid_progress_proxies:
    - backup_activation_only
    - route_update_call_only
    - automatic_fault_expiry
    - process_exit_only

features:
  allowed_sources:
    - causal_switch_telemetry
    - causal_nic_telemetry
    - immutable_static_topology
    - active_standby_role
    - causal_collective_dispatch_context
    - current_and_past_derived_state
  forbidden_fields:
    - configured_bandwidth_bps
    - fault_type
    - fault_start_time
    - fault_end_time
    - injected_loss_rate
    - injected_bandwidth
    - fault_target_port
    - fault_target_link
    - fault_active
    - severity
    - recovery_delay_ns
    - label
    - observability_weight
    - future_collective_completion
    - final_run_duration
    - future_samples
  utilization_denominator: nominal_bandwidth_bps_from_immutable_link_map
  cumulative_counter_delta:
    negative_delta_policy: reset_or_wrap_handling_never_emit_negative_rate
  causal_windows_ns: [5000000, 10000000, 20000000, 50000000, 100000000]
  paired_plane_policy:
    raw_active_standby_equality_assumption_forbidden: true
    require_role_or_healthy_baseline_normalization: true
    backup_ready_is_not_backup_health: true
  topology_context:
    physical_peer_direction_alignment: true
    same_asw_active_plane_group: true
    paired_plane_same_gpu: true
    cross_plane_rail_group: true
    same_rail_within_plane_is_same_as_same_asw: true
    independent_same_asw_same_rail_claim_allowed: false

splits:
  atomic_unit: complete_simulation_run
  random_telemetry_row_split_forbidden: true
  partitions: [train, validation, seen_link_test, unseen_link_test, ood_stress]
  manifest_generated_before_training: true
  manifest_immutable_after_training: true
  grouping_keys:
    - simulation_seed_or_schedule_id
    - fault_instance
    - target_physical_link
    - workload
    - topology
  unseen_link:
    isolation_group: paired_access_path_by_gpu_id
    minimum_held_out_gpu_groups: 4
    forbid_either_plane_pair_fault_in_training: true
  ood_default_scenarios:
    - multiple_simultaneous_faults
    - non_access_faults
    - unseen_fault_parameters
  train_validation_only_artifacts:
    - feature_normalizers
    - healthy_baselines
    - detector_thresholds
    - probability_calibration
    - early_stopping
    - model_selection
  test_labels_opened_only_by_final_evaluator: true

metrics:
  alarm_episode_deduplication: hysteresis_and_cooldown_episode
  true_positive_contract:
    first_confirmed_episode_only: true
    after_fault_applied: true
    target_physical_link_required: true
    correct_top_level_class_required: true
    either_endpoint_of_same_link_is_equivalent: true
  detection:
    latency_ns: alarm_actionable_ns_minus_fault_applied_ns
    observable_latency_ns: alarm_actionable_ns_minus_first_observable_effect_ns
    negative_latency_is_invalid: true
    no_alarm_policy: right_censored_without_numeric_imputation
    report:
      - scheduled_event_recall
      - observable_event_recall
      - precision
      - per_class_f1
      - macro_f1
      - top1_link_localization
      - median_latency_ns
      - p95_latency_ns
      - p99_latency_ns
      - latency_sample_count
    quantile_method: linear_type7
  false_alarm:
    primary_ports: active_plane_b_access_ports
    eligible_intervals: [healthy, congestion_only]
    numerator: actionable_unmatched_hard_or_gray_alarm_episodes
    denominator: eligible_port_time_ns_divided_by_3.6e12
    report_exact_exposure: true
    confidence_interval: exact_poisson_95_percent
    comparison_runs_must_match: true
    significance_test: paired_run_level_bootstrap_95_percent_rate_difference_excludes_zero
  recovery:
    post_alarm_ns: training_progress_resume_ns_minus_alarm_actionable_ns
    end_to_end_ns: training_progress_resume_ns_minus_fault_applied_ns
    required_evidence:
      - target_port_quarantined
      - no_new_affected_qp_traffic_on_target
      - all_and_only_affected_qps_migrated
      - first_backup_ack
      - current_epoch_collective_progress
      - collective_correctness_pass
    report:
      - affected_qp_precision
      - affected_qp_recall
      - unaffected_qps_moved
      - replayed_bytes
      - first_backup_tx_ns
      - first_backup_ack_ns
      - post_alarm_recovery_ns
      - end_to_end_recovery_ns
      - training_stall_ns
  collective:
    acceptable_outcomes: [correct_exactly_once_commit, safe_abort_redo_then_correct_exactly_once_commit]
    structural_digest_alone_is_sufficient: false
    require_healthy_value_or_fingerprint_oracle: true
    forbidden_outcomes:
      - silent_wrong_commit
      - old_epoch_commit_after_abort
      - duplicate_epoch_commit
      - partial_rank_commit

slo:
  hard_detection:
    metric: actionable_detection_latency_ns
    strict_lt_ns: 1000000
    required_event_compliance: 1.0
  gray_recall:
    scheduled_event_min: 0.95
    observable_event_min: 0.95
  gray_detection_latency:
    metric: actionable_detection_latency_ns
    quantile: 0.95
    strict_lt_ns: 100000000
  recovery_from_detection:
    metric: post_alarm_recovery_ns
    strict_lt_ns: 1000000000
    required_event_compliance: 1.0
  end_to_end_recovery:
    metric: end_to_end_recovery_ns
    strict_lt_ns: 1000000000
    required_event_compliance: 1.0
  affected_qp_selection:
    precision_min: 1.0
    recall_min: 1.0
    unaffected_qps_moved_max: 0
  collective_correctness:
    correct_or_safely_redone_fraction_min: 1.0
    silent_wrong_commits_max: 0
  unseen_link_generalization:
    gray_recall_absolute_drop_max_percentage_points: 5.0
  false_alarm_improvement:
    baselines: [G1_switch_sparse_64B, G6_xgboost_local]
    require_significant_rate_reduction: true

evidence_classes:
  simulated_online_closed_loop:
    may_pass_simulator_online_slo: true
    may_support_real_hardware_claim: false
  offline_causal_replay:
    may_pass_simulator_online_slo: false
    allowed_use: model_selection_and_reference_baseline
  compressed_proxy:
    may_pass_simulator_online_slo: false
    allowed_use: timer_and_censoring_pipeline_validation
  production_policy_projection:
    may_pass_simulator_online_slo: false
    allowed_use: separately_labeled_reference
  real_hardware_measurement:
    may_pass_simulator_online_slo: false
    may_support_real_hardware_claim: true

claim_boundaries:
  no_pre_onset_prediction_claim: true
  no_switch_asic_feasibility_claim_without_named_target: true
  no_real_ibverbs_or_nccl_claim_from_simulation: true
  no_tensor_correctness_claim_from_structural_digest: true
  old_288_link_validation_satisfies_this_topology: false
  old_single_plane_qghmm_corpus_role: G0_historical_baseline_only
  compressed_4ms_rdma_nccl_role: proxy_only
  p8_claim: targets_met_in_true16_dual_plane_simai_model
  real_system_claim_requires_p9: true

stage_gates:
  P0:
    name: contract_and_reproducibility
    required_artifacts:
      - limer/docs/experiment_contract.md
      - limer/configs/experiment_contract.yaml
      - baseline_manifest.json
      - contract_parse_check.json
    pass_conditions:
      - contract_version_and_hash_recorded
      - source_submodule_topology_workload_and_config_hashes_recorded
      - all_required_identifiers_and_thresholds_frozen
  P1:
    name: true16_topology_and_telemetry_audit
    required_artifacts:
      - topology_validation.json
      - telemetry_validation.json
      - healthy_true16_summary.json
      - hard_event_timeline.csv
      - stage_gate_p1.json
    pass_conditions:
      - topology_invariants_all_pass
      - snapshot_coverage_and_uniqueness_100_percent
      - counters_queues_and_link_state_integrity_pass
      - healthy_16rank_collective_completes
      - monitoring_on_off_virtual_completion_parity
      - healthy_monitoring_virtual_span_at_least_100ms
      - healthy_monitoring_snapshot_count_at_least_101
      - every_active_access_target_has_hard_alarm_under_1ms
  P2:
    name: trustworthy_fault_and_congestion_corpus
    required_artifacts:
      - corpus_manifest.json
      - split_manifest.json
      - fault_schedules
      - congestion_schedules
      - observability_report.json
      - leakage_checks.json
      - stage_gate_p2.json
    pass_conditions:
      - all_required_fault_families_and_severities_covered
      - all_16_active_access_targets_covered
      - congestion_truth_is_schedule_independent_of_features
      - causal_100ms_warmup_available
      - recovery_runs_have_1s_post_fault_observation
      - run_level_and_unseen_link_split_checks_pass
      - scheduled_and_observable_event_counts_reported
      - simulator_stability_gate_passes_or_case_is_explicitly_blocked
  P3:
    name: immutable_common_baselines
    required_detectors:
      - H0_link_state
      - G0_qghmm_legacy
      - G1_switch_sparse_64B
      - G2_extended_switch_sparse
      - G3_cusum
      - host_nic
      - rdma_error_exposure
      - collective_watchdog
      - G4_logistic_local
      - G6_xgboost_local
    pass_conditions:
      - one_locked_schedule_and_output_schema
      - every_detector_is_causal
      - evidence_class_present_on_every_result
      - baseline_artifacts_are_reproducible_and_immutable
      - proxy_projection_and_measurement_are_not_conflated
  P4:
    name: hierarchical_topology_aware_detection
    required_artifacts:
      - layer1_resource_report.json
      - layer1_gate_metrics.json
      - topology_registry.json
      - topology_aware_model
      - calibrated_thresholds.json
      - ablation_results.csv
      - stage_gate_p4.json
    pass_conditions:
      - gray_recall_slo_passes_offline_locked_test
      - gray_latency_slo_passes_offline_locked_test
      - false_alarm_improvement_slo_passes
      - unseen_link_generalization_slo_passes
      - unknown_and_insufficient_evidence_do_not_trigger_actions
      - same_asw_and_same_rail_are_not_claimed_as_independent
  P5:
    name: online_shadow_mode
    recovery_action_enabled: false
    required_artifacts:
      - online_detector_events.csv
      - alarm_bus_events.csv
      - telemetry_delivery_events.csv
      - controller_load.json
      - offline_online_parity.json
      - stage_gate_p5.json
    pass_conditions:
      - no_future_data_consumed
      - offline_online_feature_and_score_parity
      - telemetry_transport_queue_and_inference_delays_included
      - hard_actionable_alarm_slo_passes
      - gray_actionable_alarm_slo_passes
      - healthy_training_completes_with_monitor_enabled
  P6:
    name: selective_recovery_under_oracle_alarm
    detector_trigger: scheduled_oracle_alarm
    required_artifacts:
      - quarantine_events.csv
      - qp_failover_events.csv
      - rdma_wc_events.csv
      - recovery_timeline.csv
      - stage_gate_p6.json
    pass_conditions:
      - all_affected_qps_migrate
      - no_unaffected_qp_migrates
      - target_port_is_quiescent_for_affected_traffic
      - surviving_path_first_tx_and_ack_exist
      - wire_epoch_or_drain_fence_prevents_old_path_race
      - post_alarm_and_end_to_end_recovery_slos_pass_on_all_active_targets
  P7:
    name: collective_value_correctness
    required_artifacts:
      - healthy_collective_oracle.json
      - collective_transaction.csv
      - collective_correctness_cases.csv
      - stage_gate_p7.json
    pass_conditions:
      - healthy_oracle_matches_all_ranks
      - exactly_one_valid_epoch_commits
      - old_epoch_and_duplicate_data_are_rejected
      - every_case_is_correct_or_safely_redone
      - no_silent_wrong_commit
  P8:
    name: true16_online_closed_loop_acceptance
    required_artifacts:
      - raw_telemetry.csv_or_partitioned_equivalent
      - derived_features.csv_or_partitioned_equivalent
      - detector_events.csv
      - gray_fault_alarm.csv
      - qp_failover_events.csv
      - collective_events.csv
      - summary.json
      - unified_timeline.csv
      - final_metrics.json
      - automatically_computed_improvements.csv
      - stage_gate_p8.json
    pass_conditions:
      - all_detection_slos_pass
      - all_recovery_slos_pass
      - affected_qp_selection_slo_passes
      - collective_correctness_slo_passes
      - false_alarm_improvement_slo_passes
      - unseen_link_generalization_slo_passes
      - every_accepted_timing_row_is_simulated_online_closed_loop
  P9:
    name: optional_real_hardware_calibration
    required_for_simulator_claim: false
    required_for_real_system_claim: true
    pass_conditions:
      - real_switch_counter_availability_and_cadence_measured
      - real_telemetry_and_controller_delivery_measured
      - real_rdma_retry_rto_and_wc_behavior_measured
      - real_preestablished_ibverbs_qp_cutover_measured
      - real_nccl_watchdog_and_allreduce_values_checked
